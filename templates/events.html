{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Events</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<section class="py-5">
    <div class="container-fluid px-4">
        <div class="row">
            {% for event in events %}
            <article class="col-md-6 col-lg-4 mb-4">
                <a href="{% url 'event_detail' event.pk %}" class="text-decoration-none text-dark">
                    <div class="card h-100 shadow-sm">
                        <img 
                            src="{{ event.thumbnail.url }}" 
                            class="card-img-top" 
                            alt="{{ event.title }}"
                            style="height: 220px; object-fit: cover;"
                        >
                        <div class="card-body">
                            <div class="d-flex align-items-center mb-2 gap-2">
                                <span class="badge bg-primary">{{ event.category.name }}</span>
                                <small class="text-muted">{{ event.date|date:"F j, Y" }}</small>
                            </div>
                            <h5 class="card-title">{{ event.title }}</h5>
                            <p class="card-text text-muted">{{ event.description|truncatewords:15 }}</p>
                        </div>
                    </div>
                </a>
            </article>
            {% empty %}
            <p class="text-center">No events found.</p>
            {% endfor %}
        </div>
    </div>
</section>

</body>
</html>
